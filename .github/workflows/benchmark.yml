name: Compare runner layouts
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TOY_CONTAINER_IMAGE: ghcr.io/pacificcommunity/cpue-workshop@sha256:17b03d6e06da229b17524997d8a3fc8eb5f8f25233894b5ab99f89109b3890c5
      TOY_CODE_COMMIT: ${{ github.sha }}
      TOY_DATA_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/benchmark_context.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context
          path: context.tar.gz
          retention-days: 1
  fast:
    needs: prepare
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: all
  extract:
    needs: [prepare]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: extract
  cpue_vessel:
    needs: [prepare, extract]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: cpue_vessel
  cpue_year:
    needs: [prepare, extract]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: cpue_year
  prepare_vessel:
    needs: [prepare, extract, cpue_vessel]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: prepare_vessel
  prepare_year:
    needs: [prepare, extract, cpue_year]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: prepare_year
  assessment_vessel_ref:
    needs: [prepare, prepare_vessel]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: assessment_vessel_ref
  assessment_vessel_high_m:
    needs: [prepare, prepare_vessel]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: assessment_vessel_high_m
  assessment_year_ref:
    needs: [prepare, prepare_year]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: assessment_year_ref
  assessment_year_high_m:
    needs: [prepare, prepare_year]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: assessment_year_high_m
  synthesis:
    needs: [prepare, assessment_vessel_ref, assessment_vessel_high_m, assessment_year_ref, assessment_year_high_m]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: synthesis
  report:
    needs: [prepare, synthesis]
    uses: ./.github/workflows/benchmark-stage.yml
    with:
      stage: report
