name: Data to report
run-name: "Toy CPUE · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      data_repository:
        required: true
        type: string
      data_ref:
        required: true
        type: string
      analysis_ref:
        required: true
        type: string
  push:
    branches: [main]
    paths: ['data/**', 'pipeline/**', '.github/workflows/toy-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toy-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: 01 Extract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - name: Checkout source data
        if: ${{ inputs.data_repository != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.data_repository }}
          ref: ${{ inputs.data_ref }}
          path: source-data
      - name: Extract a checked snapshot
        run: python3 pipeline/extract.py
        env:
          TOY_DATA_REPOSITORY: ${{ inputs.data_repository || github.repository }}
          TOY_SOURCE_DATABASE: ${{ inputs.data_repository && 'source-data/data/toy-fishery.sqlite' || 'data/toy-fishery.sqlite' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extract-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  cpue:
    name: 02 CPUE
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extract-${{ github.run_attempt }}
          path: outputs/
      - name: Compare two recorded CPUE choices
        run: python3 pipeline/cpue.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpue-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  assessment:
    name: 03 Assessment
    needs: cpue
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cpue-${{ github.run_attempt }}
          path: outputs/
      - name: Fit the toy biomass models
        run: python3 pipeline/assessment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assessment-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  report:
    name: 04 Report
    needs: assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assessment-${{ github.run_attempt }}
          path: outputs/
      - name: Render the draft report
        run: python3 pipeline/report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error
