name: Live workshop pipeline

on:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false
    inputs:
      intake_mode:
        required: false
        type: string
        default: none
      request_id:
        required: false
        type: string
        default: ''
      data_version:
        required: false
        type: string
        default: ''
      data_repository:
        required: true
        type: string
      data_ref:
        required: true
        type: string
      analysis_ref:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: toy-pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workshop:
    name: Workshop demonstration · compact
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      TOY_CONTAINER_IMAGE: ghcr.io/pacificcommunity/cpue-workshop@sha256:17b03d6e06da229b17524997d8a3fc8eb5f8f25233894b5ab99f89109b3890c5
      TOY_CODE_COMMIT: ${{ inputs.analysis_ref || github.sha }}
      TOY_DATA_COMMIT: ${{ inputs.data_ref || github.sha }}
      TOY_DATA_REPOSITORY: ${{ inputs.data_repository || github.repository }}
      TOY_SOURCE_DATABASE: source-data/data/toy-fishery.sqlite
      TOY_STAGE_CONFIG: source-data/config/stages.json
      TOY_EXECUTION_MODE: parallel_steps
      TOY_DEMO_PACE_SECONDS: 0
      WORKSHOP_GROUP_SECONDS: 2
      WORKSHOP_INTAKE_SECONDS: 2
      WORKSHOP_INTAKE_MODE: ${{ inputs.intake_mode }}
      WORKSHOP_REQUEST_ID: ${{ inputs.request_id }}
      TOY_DATABASE_VERSION: ${{ inputs.data_version }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
          persist-credentials: false
      - name: Checkout source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.data_repository || github.repository }}
          ref: ${{ inputs.data_ref || github.sha }}
          path: source-data
          persist-credentials: false
      - name: Prepare code and container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker pull "$TOY_CONTAINER_IMAGE" &
          image_pid=$!
          python3 scripts/resolve_modules.py &
          source_pid=$!
          python3 scripts/verify_modules.py &
          check_pid=$!
          wait "$image_pid"
          wait "$source_pid"
          wait "$check_pid"
      - name: Start analysis container
        run: |
          docker run -d --name cpue-workshop --network none --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" --workdir /work \
            --env TOY_CODE_COMMIT --env TOY_DATA_COMMIT --env TOY_DATA_REPOSITORY \
            --env TOY_SOURCE_DATABASE --env TOY_CONTAINER_IMAGE --env TOY_EXECUTION_MODE \
            --env TOY_STAGE_CONFIG --env TOY_DEMO_PACE_SECONDS --env WORKSHOP_GROUP_SECONDS \
            --env WORKSHOP_INTAKE_SECONDS --env WORKSHOP_INTAKE_MODE \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env ImageVersion \
            "$TOY_CONTAINER_IMAGE" sleep 240
      - name: Data submission
        if: inputs.intake_mode == 'invalid' || inputs.intake_mode == 'valid'
        run: docker exec cpue-workshop python scripts/data_intake.py submission
      - name: QC submitted records
        id: initial_qc
        if: inputs.intake_mode == 'invalid' || inputs.intake_mode == 'valid'
        continue-on-error: ${{ inputs.intake_mode == 'invalid' }}
        run: docker exec cpue-workshop python scripts/data_intake.py qc
      - name: Return failed submission
        if: steps.initial_qc.outcome == 'failure' && inputs.intake_mode == 'invalid'
        run: docker exec cpue-workshop python scripts/data_intake.py return
      - name: Correct and resubmit example
        if: steps.initial_qc.outcome == 'failure' && inputs.intake_mode == 'invalid'
        run: docker exec cpue-workshop python scripts/data_intake.py resubmit
      - name: Recheck corrected submission
        if: steps.initial_qc.outcome == 'failure' && inputs.intake_mode == 'invalid'
        run: docker exec cpue-workshop python scripts/data_intake.py qc
      - name: Prepare and load accepted data
        if: inputs.intake_mode == 'invalid' || inputs.intake_mode == 'valid'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env TOY_CODE_COMMIT --env TOY_CONTAINER_IMAGE \
            --env WORKSHOP_INTAKE_MODE --env WORKSHOP_REQUEST_ID --env SUPABASE_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            "$TOY_CONTAINER_IMAGE" python scripts/data_intake.py ingest
      - name: Fetch versioned database snapshot
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work \
            --env SUPABASE_URL --env SUPABASE_ANON_KEY --env TOY_DATABASE_VERSION --env TOY_SOURCE_DATABASE --env TOY_STAGE_CONFIG \
            "$TOY_CONTAINER_IMAGE" python supabase/snapshot.py
          python3 -c 'import json,os,pathlib; v=json.loads(pathlib.Path(os.environ["TOY_SOURCE_DATABASE"]).with_suffix(".release.json").read_text())["version"]; open(os.environ["GITHUB_ENV"],"a").write(f"TOY_SOURCE_PROVIDER=supabase\nTOY_SOURCE_VERSION={v}\n")'
      - name: Restore and verify reusable outputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/workflow_plan.py
      - name: "Extract [extract=${{ steps.plan.outputs.extract }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 0
      - name: "CPUE analyses [cpue_vessel=${{ steps.plan.outputs.cpue_vessel }} cpue_year=${{ steps.plan.outputs.cpue_year }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 1
      - name: "Prepare inputs and compare CPUE [prepare_vessel=${{ steps.plan.outputs.prepare_vessel }} prepare_year=${{ steps.plan.outputs.prepare_year }} cpue_summary=${{ steps.plan.outputs.cpue_summary }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 2
      - name: "Assessment models and CPUE report [assessment_vessel_ref=${{ steps.plan.outputs.assessment_vessel_ref }} assessment_vessel_high_m=${{ steps.plan.outputs.assessment_vessel_high_m }} assessment_year_ref=${{ steps.plan.outputs.assessment_year_ref }} assessment_year_high_m=${{ steps.plan.outputs.assessment_year_high_m }} cpue_report=${{ steps.plan.outputs.cpue_report }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 3
      - name: "Assessment results [synthesis=${{ steps.plan.outputs.synthesis }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 4
      - name: "Assessment report [report=${{ steps.plan.outputs.report }}]"
        run: docker exec --env TOY_SOURCE_PROVIDER --env TOY_SOURCE_VERSION cpue-workshop python scripts/run_group.py 5
      - name: Save the complete workflow outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-${{ github.run_attempt }}
          path: stages/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Stop the demo container
        if: always()
        run: docker rm -f cpue-workshop
