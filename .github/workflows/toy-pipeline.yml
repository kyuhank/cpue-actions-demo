name: Data to report
run-name: "Toy CPUE · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      data_repository:
        required: true
        type: string
      data_ref:
        required: true
        type: string
      analysis_ref:
        required: true
        type: string
  push:
    branches: [main]
    paths: ['data/**', 'pipeline/**', 'scripts/container-stage.sh', '.github/workflows/toy-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toy-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: 01 Extract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - name: Checkout source data
        if: ${{ inputs.data_repository != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.data_repository }}
          ref: ${{ inputs.data_ref }}
          path: source-data
      - name: Extract a checked snapshot
        run: sh scripts/container-stage.sh extract
        env:
          TOY_DATA_COMMIT: ${{ inputs.data_ref || github.sha }}
          TOY_DATA_REPOSITORY: ${{ inputs.data_repository || github.repository }}
          TOY_SOURCE_DATABASE: ${{ inputs.data_repository && 'source-data/data/toy-fishery.sqlite' || 'data/toy-fishery.sqlite' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extract-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  cpue_vessel:
    name: '02 CPUE: year + vessel'
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extract-${{ github.run_attempt }}
          path: outputs/
      - name: Fit CPUE with year and vessel effects
        run: sh scripts/container-stage.sh cpue
        env:
          TOY_CPUE_CHOICE: vessel_adjusted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpue_vessel-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  cpue_year:
    name: '02 CPUE: year only'
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extract-${{ github.run_attempt }}
          path: outputs/
      - name: Fit CPUE with year effects
        run: sh scripts/container-stage.sh cpue
        env:
          TOY_CPUE_CHOICE: year_only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpue_year-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  assessment:
    name: 03 Assessment
    needs: [cpue_vessel, cpue_year]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cpue_vessel-${{ github.run_attempt }}
          path: inputs/cpue_vessel/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cpue_year-${{ github.run_attempt }}
          path: inputs/cpue_year/
      - name: Fit the toy biomass models
        run: sh scripts/container-stage.sh assessment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assessment-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error

  report:
    name: 04 Report
    needs: assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assessment-${{ github.run_attempt }}
          path: outputs/
      - name: Render the draft report
        run: sh scripts/container-stage.sh report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-${{ github.run_attempt }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error
