name: Data to report
run-name: "Toy CPUE · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false
    inputs:
      data_version:
        required: false
        type: string
        default: ''
      data_repository:
        required: true
        type: string
      data_ref:
        required: true
        type: string
      analysis_ref:
        required: true
        type: string
  push:
    branches: [main]
    paths: ['data/**', 'pipeline/**', 'scripts/**', 'modules.lock.json', 'module-branches.json', '.github/workflows/toy-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toy-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "[plan] Verify sources and prepare inputs"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      extract: ${{ steps.plan.outputs.extract }}
      cpue_vessel: ${{ steps.plan.outputs.cpue_vessel }}
      cpue_year: ${{ steps.plan.outputs.cpue_year }}
      prepare_vessel: ${{ steps.plan.outputs.prepare_vessel }}
      prepare_year: ${{ steps.plan.outputs.prepare_year }}
      assessment_vessel_ref: ${{ steps.plan.outputs.assessment_vessel_ref }}
      assessment_vessel_high_m: ${{ steps.plan.outputs.assessment_vessel_high_m }}
      assessment_year_ref: ${{ steps.plan.outputs.assessment_year_ref }}
      assessment_year_high_m: ${{ steps.plan.outputs.assessment_year_high_m }}
      synthesis: ${{ steps.plan.outputs.synthesis }}
      report: ${{ steps.plan.outputs.report }}
    env:
      TOY_CONTAINER_IMAGE: ghcr.io/pacificcommunity/cpue-workshop@sha256:17b03d6e06da229b17524997d8a3fc8eb5f8f25233894b5ab99f89109b3890c5
      TOY_CODE_COMMIT: ${{ inputs.analysis_ref || github.sha }}
      TOY_DATA_COMMIT: ${{ inputs.data_ref || github.sha }}
      TOY_DATA_REPOSITORY: ${{ inputs.data_repository || github.repository }}
      TOY_SOURCE_DATABASE: ${{ inputs.data_repository && 'source-data/data/toy-fishery.sqlite' || 'data/toy-fishery.sqlite' }}
      TOY_EXECUTION_MODE: module_jobs
      TOY_GITHUB_JOB: workshop
      TOY_STAGE_CONFIG: ${{ inputs.data_repository && 'source-data/config/stages.json' || 'config/stages.json' }}
      TOY_DEMO_PACE_SECONDS: 4
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TOY_DATABASE_VERSION: ${{ inputs.data_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kyuhank/cpue-actions-demo
          ref: ${{ inputs.analysis_ref || github.sha }}
      - name: Checkout source data
        if: ${{ inputs.data_repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.data_repository }}
          ref: ${{ inputs.data_ref }}
          path: source-data
      - name: Pull the pinned container
        run: docker pull "$TOY_CONTAINER_IMAGE"
      - name: Retrieve locked analysis modules
        run: python3 scripts/resolve_modules.py
      - name: Verify repository CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_modules.py
      - name: Fetch versioned database snapshot
        if: env.SUPABASE_URL != '' || inputs.data_version != ''
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work \
            --env SUPABASE_URL --env SUPABASE_ANON_KEY --env TOY_DATABASE_VERSION --env TOY_SOURCE_DATABASE --env TOY_STAGE_CONFIG \
            "$TOY_CONTAINER_IMAGE" python supabase/snapshot.py
          python3 -c 'import json,os,pathlib; v=json.loads(pathlib.Path(os.environ["TOY_SOURCE_DATABASE"]).with_suffix(".release.json").read_text())["version"]; open(os.environ["GITHUB_ENV"],"a").write(f"TOY_SOURCE_PROVIDER=supabase\nTOY_SOURCE_VERSION={v}\n")'
      - name: Restore and verify reusable outputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/workflow_plan.py
      - name: Freeze the verified workspace
        run: python3 scripts/workflow_context.py
      - name: Save code and recorded inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-context-${{ github.run_attempt }}
          path: workflow-context.tar.gz
          retention-days: 1
          if-no-files-found: error
  extract:
    name: "[extract] ${{ needs.prepare.outputs.extract == 'reuse' && '· reused' || '' }}"
    needs: [prepare]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.extract == 'run' }}
    uses: kyuhank/cpue-demo-extract/.github/workflows/stage.yml@a0716f589325a5576f5b9d97990e3977c17bad36
    with:
      stage: extract
  cpue_vessel:
    name: "[cpue_vessel] ${{ needs.prepare.outputs.cpue_vessel == 'reuse' && '· reused' || '' }}"
    needs: [prepare, extract]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.cpue_vessel == 'run' }}
    uses: kyuhank/cpue-demo-cpue/.github/workflows/stage.yml@b2c79ee958c6e7128be347078b7ea9e29c642bc4
    with:
      stage: cpue_vessel
  cpue_year:
    name: "[cpue_year] ${{ needs.prepare.outputs.cpue_year == 'reuse' && '· reused' || '' }}"
    needs: [prepare, extract]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.cpue_year == 'run' }}
    uses: kyuhank/cpue-demo-cpue/.github/workflows/stage.yml@b2c79ee958c6e7128be347078b7ea9e29c642bc4
    with:
      stage: cpue_year
  prepare_vessel:
    name: "[prepare_vessel] ${{ needs.prepare.outputs.prepare_vessel == 'reuse' && '· reused' || '' }}"
    needs: [prepare, extract, cpue_vessel]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.prepare_vessel == 'run' }}
    uses: kyuhank/cpue-demo-inputs/.github/workflows/stage.yml@402a3bc75db66afa8074f75ef25201b4d1b6bdb4
    with:
      stage: prepare_vessel
  prepare_year:
    name: "[prepare_year] ${{ needs.prepare.outputs.prepare_year == 'reuse' && '· reused' || '' }}"
    needs: [prepare, extract, cpue_year]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.prepare_year == 'run' }}
    uses: kyuhank/cpue-demo-inputs/.github/workflows/stage.yml@402a3bc75db66afa8074f75ef25201b4d1b6bdb4
    with:
      stage: prepare_year
  assessment_vessel_ref:
    name: "[assessment_vessel_ref] ${{ needs.prepare.outputs.assessment_vessel_ref == 'reuse' && '· reused' || '' }}"
    needs: [prepare, prepare_vessel]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.assessment_vessel_ref == 'run' }}
    uses: kyuhank/cpue-demo-assessment/.github/workflows/stage.yml@86d7704fd2eaa9b5482acaad16adc0c0a820ddf7
    with:
      stage: assessment_vessel_ref
  assessment_vessel_high_m:
    name: "[assessment_vessel_high_m] ${{ needs.prepare.outputs.assessment_vessel_high_m == 'reuse' && '· reused' || '' }}"
    needs: [prepare, prepare_vessel]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.assessment_vessel_high_m == 'run' }}
    uses: kyuhank/cpue-demo-assessment/.github/workflows/stage.yml@86d7704fd2eaa9b5482acaad16adc0c0a820ddf7
    with:
      stage: assessment_vessel_high_m
  assessment_year_ref:
    name: "[assessment_year_ref] ${{ needs.prepare.outputs.assessment_year_ref == 'reuse' && '· reused' || '' }}"
    needs: [prepare, prepare_year]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.assessment_year_ref == 'run' }}
    uses: kyuhank/cpue-demo-assessment/.github/workflows/stage.yml@86d7704fd2eaa9b5482acaad16adc0c0a820ddf7
    with:
      stage: assessment_year_ref
  assessment_year_high_m:
    name: "[assessment_year_high_m] ${{ needs.prepare.outputs.assessment_year_high_m == 'reuse' && '· reused' || '' }}"
    needs: [prepare, prepare_year]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.assessment_year_high_m == 'run' }}
    uses: kyuhank/cpue-demo-assessment/.github/workflows/stage.yml@86d7704fd2eaa9b5482acaad16adc0c0a820ddf7
    with:
      stage: assessment_year_high_m
  synthesis:
    name: "[synthesis] ${{ needs.prepare.outputs.synthesis == 'reuse' && '· reused' || '' }}"
    needs: [prepare, assessment_vessel_ref, assessment_vessel_high_m, assessment_year_ref, assessment_year_high_m]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.synthesis == 'run' }}
    uses: kyuhank/cpue-demo-synthesis/.github/workflows/stage.yml@2f0879bfe74c9d3131f38ec0fd38473582391518
    with:
      stage: synthesis
  report:
    name: "[report] ${{ needs.prepare.outputs.report == 'reuse' && '· reused' || '' }}"
    needs: [prepare, synthesis]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.result == 'success' && needs.prepare.outputs.report == 'run' }}
    uses: kyuhank/cpue-demo-report/.github/workflows/stage.yml@0815afc29e18be64c2db70fd562e81b40a2950ec
    with:
      stage: report
