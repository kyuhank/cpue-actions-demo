<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPUE workflow demonstration</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f8fa;color:#001743;font:17px/1.5 Arial,sans-serif}main{max-width:1240px;margin:30px auto;padding:0 22px}h1{font-size:34px;margin:0 0 8px}p{color:#536b7b;margin:0 0 20px}nav{display:flex;gap:8px;margin:18px 0 12px}button{font:inherit;cursor:pointer;border:1px solid #c8dce6;background:white;color:#536b7b;padding:8px 18px;border-radius:6px}button.selected{background:#001743;color:white;border-color:#001743}iframe{width:100%;height:520px;border:1px solid #d1e2e8;border-radius:12px;background:white}iframe[hidden]{display:none}footer{font-size:15px;color:#536b7b;margin-top:18px}a{color:#0085ca}</style>
<main><h1>One workflow. Follow every run.</h1><p>Synthetic data · actual GitHub execution · no visitor account required</p><nav aria-label="Demonstration views"><button class="selected" data-view="panel">Workflow</button><button data-view="guest">Job manager</button><button data-view="review">Report</button></nav><iframe data-view="panel" src="panel.html" title="Workflow"></iframe><iframe data-view="guest" src="guest.html" title="Job management" hidden></iframe><iframe data-view="review" src="review.html" title="Report and run history" hidden></iframe><footer>GitHub Actions runs this demonstration. Protected-data production would use approved HPC.<br><a href="https://github.com/kyuhank/cpue-toy-data/actions">GitHub runs</a> · <a href="https://github.com/kyuhank/cpue-actions-demo">Analysis code</a> · <a href="browser.html">Offline calculations</a></footer></main>
<script>let selected='panel';function show(view){selected=view;for(const f of document.querySelectorAll('iframe')){f.hidden=f.dataset.view!==view;f.contentWindow?.postMessage({type:'cpue-view-active',active:!f.hidden},location.origin);}for(const b of document.querySelectorAll('button'))b.classList.toggle('selected',b.dataset.view===view);}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('iframe').forEach(f=>f.onload=()=>show(selected));window.addEventListener('message',e=>{if(e.origin===location.origin&&[...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source)&&e.data?.type==='cpue-open-report')show('review');});</script></html>
