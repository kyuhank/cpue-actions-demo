<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connected analysis workflow</title>
<link rel="stylesheet" href="./panel.css"></head><body><main>
<div class="top"><div class="brand"><span class="dot" id="live-dot"></span><strong>GitHub Actions</strong><a id="run-link" target="_blank" rel="noopener">Connecting…</a></div><span id="run-state" class="run-state">Actual execution · synthetic data</span></div>
<div class="chain" id="chain" aria-label="Select a stage to update it and its dependent stages"></div>
<div class="preview" id="preview" role="tooltip" hidden><strong id="preview-title"></strong><span class="state" id="preview-state"></span><pre id="preview-record"></pre><div class="preview-inputs" id="preview-source" hidden></div><div class="preview-inputs" id="preview-inputs" hidden></div></div>
<div class="action-bar"><div class="selection"><strong id="selection-title">New data</strong><span id="progress">Select a box, then Run.</span></div><button id="invalid" class="quality" hidden>Test failed QC</button><button id="run" class="run-button" disabled>Run →</button></div>
<div class="record"><span class="dot" id="record-dot"></span><span id="message" role="status">Connecting to GitHub…</span><time id="verified"></time><button id="logs" aria-expanded="false" aria-controls="console">Show record</button></div>
<div class="console" id="console" hidden><div class="console-head"><span id="console-title">GitHub execution record</span><a id="console-link" target="_blank" rel="noopener">View run ↗</a></div><pre id="console-lines">Waiting for GitHub…</pre></div>
<div class="notice" id="notice" role="status" hidden><span id="notice-text"></span><button aria-label="Dismiss message" id="dismiss">×</button></div>
</main><script src="./cloud.js"></script><script src="./panel.js"></script></body></html>
